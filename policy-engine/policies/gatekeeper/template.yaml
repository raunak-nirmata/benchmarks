apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: policybenchrequireteam
spec:
  crd:
    spec:
      names:
        kind: PolicyBenchRequireTeam
      validation:
        openAPIV3Schema:
          type: object
  targets:
    - target: admission.k8s.gatekeeper.sh
      code:
        - engine: Rego
          source:
            version: "v1"
            rego: |
              package policybenchrequireteam

              violation contains {"msg": msg} if {
                annotations := object.get(input.review.object.metadata, "annotations", {})
                object.get(annotations, "policy-bench-team", "") != "platform"
                msg := "policy-bench-team annotation must equal platform"
              }
